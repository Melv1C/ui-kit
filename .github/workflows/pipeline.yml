name: Pipeline (Quality & Storybook Deploy)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "package.json"
      - "package-lock.json"

jobs:
  ci-cd:
    name: Build, Check & Deploy Storybook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Prettier Check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Storybook image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.storybook
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ui-kit-storybook:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ui-kit-storybook:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy Storybook Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -X 'POST' \
          '${{ secrets.DOKPLOY_DOMAIN }}/api/application.deploy' \
          -H 'accept: application/json' \
          -H 'x-api-key: ${{ secrets.DOKPLOY_API_KEY }}' \
          -H 'Content-Type: application/json' \
          -d '{
               "applicationId": "${{ secrets.DOKPLOY_STORYBOOK_APP_ID }}"
            }'
